name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality / rust 1.91.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported toolchain
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component clippy,rustfmt
          rustup default 1.91.1

      - name: Run canonical repository gate
        run: ./scripts/check

  stable:
    name: stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run cross-platform tests
        run: cargo test --workspace --all-features
