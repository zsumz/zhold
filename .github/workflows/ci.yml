name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality / rust 1.91.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported toolchain
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component clippy,rustfmt
          rustup default 1.91.1

      - name: Run canonical repository gate
        run: ./scripts/check

  stable:
    name: stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Enforce architecture boundaries
        run: python scripts/guardrails.py

      - name: Run cross-platform Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run cross-platform tests
        run: cargo test --locked --workspace --all-features

      - name: Verify the default command surface
        run: cargo test --locked -p zhold --no-default-features default_help_excludes_experimental_control_plane

  smoke:
    name: smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Install minimum supported Rust
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1

      - name: Run installed CLI smoke tests
        if: runner.os != 'Windows'
        run: ./scripts/smoke

      - name: Run installed CLI smoke tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1

  package:
    name: package / clean install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1

      - name: Verify packaged crates and clean installation
        run: ./scripts/package-smoke
