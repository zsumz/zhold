[workspace]
members = [
    "crates/zhold-cli",
    "crates/zhold-core",
    "crates/zhold-store",
]
default-members = ["crates/zhold-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/zsumz/zhold"
authors = ["zsumz contributors"]
readme = "README.md"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
command-group = "5.0"
fs2 = "0.4"
libc = "0.2"
nix = { version = "0.27", default-features = false, features = ["process", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
tempfile = "3.21"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
zhold-core = { path = "crates/zhold-core" }
zhold-store = { path = "crates/zhold-store" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
